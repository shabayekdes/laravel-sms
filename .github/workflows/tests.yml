name: tests

on:
  push:
      branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '8', testbench: '6', php: '8.1' }
          - { laravel: '9', testbench: '7', php: '8.1' }
          - { laravel: '9', testbench: '7', php: '8.2' }
          - { laravel: '10', testbench: '8', php: '8.1' }
          - { laravel: '10', testbench: '8', php: '8.2' }
          - { laravel: '10', testbench: '8', php: '8.3' }
          - { laravel: '11', testbench: '9', php: '8.2' }
          - { laravel: '11', testbench: '9', php: '8.3' }
          - { laravel: '11', testbench: '9', php: '8.4' }
          - { laravel: '12', testbench: '10', php: '8.2' }
          - { laravel: '12', testbench: '10', php: '8.3' }
          - { laravel: '12', testbench: '10', php: '8.4' }
          - { laravel: '13', testbench: '11', php: '8.3' }
          - { laravel: '13', testbench: '11', php: '8.4' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer json/lock
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      # The lock file pins Laravel 8 for local development, so each job
      # resolves its own Laravel and Testbench versions instead.
      - name: Install Composer Dependencies
        run: |
          composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run Unit Test
        run: composer test
